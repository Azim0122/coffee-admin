<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Point Admin</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>try{const t=localStorage.getItem('cafe.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<!-- CLOUD LOGIN (аккаунт кафе в Supabase) -->
<div class="login" id="cloudLogin" hidden>
  <form class="login-card" id="cloudForm" autocomplete="on">
    <div class="login-brand"><div class="brand-logo">☕</div><div><div class="brand-name">Coffee Point</div><div class="brand-sub">Вход для кафе</div></div></div>
    <div class="login-title">Вход в аккаунт кафе</div>
    <p class="cloud-sub">Один раз на каждом устройстве. Дальше сотрудники входят по своему PIN-коду.</p>
    <div class="field"><label>Почта</label><input class="input" name="email" type="email" required autocomplete="username"></div>
    <div class="field" style="margin-top:12px"><label>Пароль</label><input class="input" name="password" type="password" required autocomplete="current-password"></div>
    <div class="cloud-err" id="cloudErr"></div>
    <button class="btn btn-primary btn-lg" type="submit" style="width:100%;margin-top:14px">Войти</button>
  </form>
</div>
<div class="login" id="cloudLoading" hidden><div class="loading-box"><div class="spinner"></div><b>Загружаем данные кафе…</b><span>синхронизация с облаком</span></div></div>

<!-- LOGIN -->
<div class="login" id="login" hidden>
  <div class="login-card">
    <div class="login-brand"><div class="brand-logo">☕</div><div><div class="brand-name" data-cafe-name></div><div class="brand-sub">Вход в систему</div></div></div>
    <div class="login-step" id="loginStaff">
      <div class="login-title">Кто на смене?</div>
      <div class="login-staff" id="loginStaffList"></div>
    </div>
    <div class="login-step" id="loginPin" hidden>
      <button class="login-back" id="loginBack">← Назад</button>
      <div class="login-who" id="loginWho"></div>
      <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
      <div class="pin-pad" id="pinPad"></div>
      <div class="login-hint">Демо: админ — 1111, кассиры — 2222, 3333</div>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">☕</div>
      <div><div class="brand-name" data-cafe-name></div><div class="brand-sub">Панель управления</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="shift-mini" id="shiftMini"></div>
      <div class="me" id="me"></div>
    </div>
  </aside>
  <div class="sidebar-bg" id="sidebarBg"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-sm" id="menuBtn" data-tip="Меню"></button>
      <div class="topbar-title">
        <h1 id="pageTitle"></h1>
        <div class="date" id="pageSub"></div>
      </div>
      <div class="topbar-actions" id="topActions"></div>
      <div class="topbar-tools">
        <span class="sync-dot off" id="syncDot" title="Локальный режим"></span>
        <div class="clock num" id="clock"></div>
        <button class="icon-btn" id="themeBtn" title="Сменить тему"></button>
        <button class="icon-btn" id="lockBtn" title="Выйти / сменить пользователя"></button>
      </div>
    </header>
    <div class="content" id="content"><div id="view"></div></div>
  </main>
  <nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div class="toasts" id="toasts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/pos.js"></script>
<script src="js/views/catalog.js"></script>
<script src="js/views/sales.js"></script>
<script src="js/views/people.js"></script>
<script src="js/views/money.js"></script>
<script src="js/views/daily.js"></script>
<script src="js/views/system.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
